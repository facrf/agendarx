name: Publicar imagem dos pacotes

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag de versão já validada (ex. v0.6.5d)
        required: true
        type: string
      source_run_id:
        description: ID da execução que produziu os quatro pacotes
        required: true
        type: string

permissions:
  contents: write
  actions: read
  packages: write
  id-token: write

concurrency:
  group: imagem-pacotes-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar imagem e Release
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - name: Obter ferramentas de publicação
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Validar origem dos pacotes
        id: origem
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)([a-z])?$ ]]
          linha="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          principal="${BASH_REMATCH[1]}"
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          git check-ref-format "refs/tags/$TAG"
          sha="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          execucao="$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID")"
          jq -e --arg tag "$TAG" '.path == ".github/workflows/release.yml" and .event == "push" and .head_branch == $tag' <<< "$execucao" >/dev/null
          origem="$(jq -r '.head_sha' <<< "$execucao")"
          [[ "$sha" == "$origem" ]]
          jobs="$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100")"
          for nome in 'Validar versão' 'Compilar frontend' 'Binário Intel/AMD 64 bits' 'Binário ARM 64 bits' 'Binário ARM 32 bits v7' 'Binário RISC-V 64 bits'; do
            jq -e --arg nome "$nome" '.jobs | any(.name == $nome and .conclusion == "success")' <<< "$jobs" >/dev/null
          done
          echo "versao=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "linha=$linha" >> "$GITHUB_OUTPUT"
          echo "principal=$principal" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "imagem=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Recuperar pacotes da versão
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: .cache/pacotes
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}

      - name: Preparar imagem com binários validados
        env:
          VERSAO: ${{ steps.origem.outputs.versao }}
        run: bash scripts/prepare-image.sh "$VERSAO" .cache/pacotes .cache/imagem-release

      - name: Preparar QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Autenticar no GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar tags e metadados OCI
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.origem.outputs.imagem }}
          tags: |
            type=raw,value=${{ steps.origem.outputs.versao }}
            type=raw,value=${{ steps.origem.outputs.linha }}
            type=raw,value=${{ steps.origem.outputs.principal }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ steps.origem.outputs.versao }}
            org.opencontainers.image.revision=${{ steps.origem.outputs.sha }}

      - name: Publicar imagem multi-arquitetura
        id: publicar
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .cache/imagem-release
          file: .github/docker/packaged.Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=imagem-pacotes-release
          cache-to: type=gha,mode=max,scope=imagem-pacotes-release
          sbom: true
          provenance: mode=max

      - name: Testar inicialização nas três arquiteturas
        env:
          IMAGE: ${{ steps.origem.outputs.imagem }}@${{ steps.publicar.outputs.digest }}
        run: bash scripts/smoke-image.sh "$IMAGE"

      - name: Publicar GitHub Release e pacotes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" .cache/pacotes/* --clobber
          else
            gh release create "$TAG" .cache/pacotes/* --verify-tag --generate-notes --latest --title "AgendarX $TAG"
          fi
