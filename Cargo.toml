[package]
name = "agendarx"
version = "0.6.2"
edition = "2024"
publish = false
description = "Agenda de contatos e dossiê interpessoal com grafo e pesquisa pública"
homepage = "https://github.com/facrf/agendarx"
repository = "https://github.com/facrf/agendarx"

[dependencies]
argon2 = "0.5"
axum = { version = "0.8", features = ["http2", "macros", "multipart"] }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
http = "1"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }
infer = "0.19"
jsonwebtoken = { version = "9", default-features = false }
mime = "0.3"
quick-xml = "0.38"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "query", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.6", features = ["compression-gzip", "fs", "limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "4", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
